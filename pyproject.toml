[project]
name = "secondbrain-rag"
version = "1.0.0"
description = "RAG API over a personal knowledge base, with an evaluation harness that gates releases."
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Both insert the repo root on sys.path before importing app/, so imports
# cannot sit at the top of the file.
"evals/run_eval.py" = ["E402"]
"tests/test_api.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
