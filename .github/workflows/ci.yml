name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app evals tests
      - name: Unit tests
        run: pytest -q
      - name: Evaluation gate
        # Blocks the merge if retrieval quality or latency regresses.
        run: python -m evals.run_eval --gate
